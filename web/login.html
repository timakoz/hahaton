<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Вход — ForestMerge</title>
  <style>
    :root { --ink: #1f2a1f; --muted: #6b7568; --line: #dfe3da; --accent: #2f6b3a; --bad: #b91c1c;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: var(--ink); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #1f3b26 radial-gradient(circle at 30% 20%, #2f6b3a 0, #1f3b26 60%); padding: 16px; }
    main { width: min(380px, 100%); background: #fff; border-radius: 12px; padding: 28px 26px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; color: var(--ink); }
    p.sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; }
    input:focus { outline: 2px solid #9cc9a3; border-color: var(--accent); }
    button { width: 100%; margin-top: 18px; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
             border: 0; border-radius: 7px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--bad); background: #fef2f2; border: 1px solid #fecaca; border-radius: 7px; padding: 8px 10px; margin-top: 14px; font-size: 13px; }
    .foot { margin-top: 16px; color: var(--muted); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 2 5 12h4l-4 6h6v4h2v-4h6l-4-6h4z"/></svg>
    <h1>ForestMerge</h1>
  </div>
  <p class="sub">Объединение фрагментированных лесотаксационных выделов</p>
  <form id="f" autocomplete="on">
    <label for="login">Логин</label>
    <input id="login" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Войти</button>
    <div id="err" class="err" hidden></div>
  </form>
  <div class="foot">Доступ выдаёт администратор сервера</div>
</main>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  const next = (() => {
    const n = new URLSearchParams(location.search).get("next") || "/";
    return n.startsWith("/") && !n.startsWith("//") ? n : "/";       // только внутренние адреса
  })();
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true; go.disabled = true; go.textContent = "Вход…";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ login: f.username.value.trim(), password: f.password.value }),
      });
      if (r.ok) { location.replace(next); return; }
      let msg = "Не удалось войти";
      try { msg = (await r.json()).detail || msg; } catch (_) { /* не JSON */ }
      err.textContent = msg; err.hidden = false;
      f.password.value = ""; f.password.focus();
    } catch (_) {
      err.textContent = "Сервер недоступен"; err.hidden = false;
    } finally {
      go.disabled = false; go.textContent = "Войти";
    }
  });
</script>
</body>
</html>
