# Сайт hakaton.softrush.ru на РОУТЕРЕ (Proxmox VM 100, nginx 1.24) — в том же стиле, что webui.conf:
# сначала только порт 80, затем «sudo certbot --nginx -d hakaton.softrush.ru» сам допишет HTTPS (443),
# сертификат и редирект с http (строки «# managed by Certbot»).
#
#   sudo cp router-nginx-hakaton.conf /etc/nginx/sites-available/hakaton.softrush.ru   # или создать nano-ом
#   sudo ln -s /etc/nginx/sites-available/hakaton.softrush.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hakaton.softrush.ru        # на вопрос о редиректе — «Redirect»
#
# 10.1.3.102 — внутренний IP виртуалки с приложением; поменяйте, если у неё другой адрес.

server {
    listen 80;
    server_name hakaton.softrush.ru;

    client_max_body_size 200m;            # загрузка выгрузок ТО

    location / {
        proxy_pass http://10.1.3.102:8765;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;                       # обязательно (проверка Origin)
        proxy_set_header X-Real-IP         $remote_addr;                # защита от перебора паролей
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
