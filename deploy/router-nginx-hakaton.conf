# Блок для nginx на РОУТЕРЕ (Proxmox VM 100), который принимает 80/443 для *.softrush.ru и
# раздаёт сайты по внутренним VM. Добавляет сайт hakaton.softrush.ru → VM с ForestMerge.
#
# Проще всего: скопировать файл соседнего сайта (там уже правильные пути к сертификату), поменять
# server_name и proxy_pass, как ниже. Заменить:
#   APP_VM_IP      — внутренний IP виртуалки с приложением (на ней: ip -4 addr)
#   SSL-пути       — как у соседних сайтов (если есть общий сертификат *.softrush.ru — он подходит);
#                    либо выпустить свой: sudo certbot certonly --webroot -w /var/www/certbot -d hakaton.softrush.ru
# Проверка и применение:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name hakaton.softrush.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: убрать эту строку и писать «listen 443 ssl http2;»
    server_name hakaton.softrush.ru;

    ssl_certificate     /etc/letsencrypt/live/hakaton.softrush.ru/fullchain.pem;   # ← как у соседних сайтов
    ssl_certificate_key /etc/letsencrypt/live/hakaton.softrush.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 200m;     # загрузка выгрузок ТО

    location / {
        proxy_pass http://APP_VM_IP:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                    # обязательно: приложение сверяет Origin с Host
        proxy_set_header X-Real-IP $remote_addr;        # реальный IP — для защиты от перебора паролей
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
