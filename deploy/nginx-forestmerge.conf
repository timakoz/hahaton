# nginx перед ForestMerge: HTTPS на 443, HTTP → HTTPS. Приложение слушает только 127.0.0.1:8765.
# Это шаблон: scripts/setup_https.sh подставляет домен, пути к сертификату и заголовок HSTS.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # проверка владения доменом для Let's Encrypt (продление сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FMSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    __HSTS__
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 200m;      # загрузка выгрузок ТО (CSV/XLSX до ~20 МБ каждая)

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # расчёт большого квартала / импорт
        proxy_send_timeout 300s;
    }
}
